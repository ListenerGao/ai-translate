<style>
:root { --bg:#f5f6f8; --surface:#fff; --fg:#18202c; --muted:#5a6375; --line:#c5ccd8; --accent:#2753c8; --pick:#15803d; color-scheme: light; }

<header><h1>字幕写法对比</h1><p class="lead">同一个模型（Index-Translate-2B Q8_0）用 4 种写法逐条翻 30 条英文字幕（两段自写样例，故意包含跨条拆开的句子和代词）。每条选最好的一个译文，分不出就选「都差不多」；译文一样的写法合成一个。选完点「揭晓」看每种写法各被选了几次。选择只保存在这个浏览器里。</p></header>
<div class="bar"><span>已选 <b id="done">0</b> / <b id="total">0</b></span><button id="reveal" disabled>揭晓</button></div>
<div id="items"></div>
<section id="result" hidden><h2>结果</h2><table id="tally"></table></section>
</main><script>

tried three different approaches.", "next": "Let me show you why.", "cands": [{"text": "第一个是个灾难。", "variants": ["a"]}, {"text": "第一个就是一场灾难。", "variants": ["b"]}, {"text": "第一个方法是个灾难。", "variants": ["c", "d"]}]}, {"id": 16, "file": "talk", "source": "Let me show you why.", "prev": "The first one was a disaster.", "next": "Under the hood, every request", "cands": [{"text": "我来告诉你原因。", "variants": ["b", "c"]}, {"text": "让我告诉你原因。", "variants": ["a", "d"]}]}, {"id": 17, "file": "talk", "source": "Under the hood, every request", "prev": "Let me show you why.", "next": "loaded the whole model from scratch.", "cands": [{"text": "在引擎内部，每一次请求", "variants": ["b", "c"]}, {"text": "在底层，每一次请求", "variants": ["a"]}, {"text": "在引擎下，每一次请求", "variants": ["d"]}]}, {"id": 18, "file": "talk", "source": "loaded the whole model from scratch.", "prev": "Under the hood, every request", "next": "", "cands": [{"text": "从头到尾加载了整个模型。", "variants": ["a", "b", "c", "d"]}]}, {"id": 19, "file": "dialog", "source": "Did you push the fix last night?", "prev": "", "next": "I did, but it broke the build.", "cands": [{"text": "你昨晚推了修复吗？", "variants": ["a", "d"]}, {"text": "昨晚你推了修复吗？", "variants": ["b", "c"]}]}, {"id": 20, "file": "dialog", "source": "I did, but it broke the build.", "prev": "Did you push the fix last night?", "next": "Again? What happened this time?", "cands": [{"text": "我做了，但破坏了构建过程。", "variants": ["a"]}, {"text": "我试了，但搞坏了整个构建。", "variants": ["c"]}, {"text": "我试了，但破坏了构建过程。", "variants": ["d"]}, {"text": "我试了，但搞坏了整个流程。", "variants": ["b"]}]}, {"id": 21, "file": "dialog", "source": "Again? What happened this time?", "prev": "I did, but it broke the build.", "next": "Someone renamed the config file", "cands": [{"text": "又？这次又怎么了？", "variants": ["a"]}, {"text": "又？这次怎么了？", "variants": ["b", "c", "d"]}]}, {"id": 22, "file": "dialog", "source": "Someone renamed the config file", "prev": "Again? What happened this time?", "next": "and forgot to tell anyone.", "cands": [{"text": "有人重命名了配置文件", "variants": ["b", "d"]}, {"text": "有人重命名了配置文件。", "variants": ["a", "c"]}]}, {"id": 23, "file": "dialog", "source": "and forgot to tell anyone.", "prev": "Someone renamed the config file", "next": "Classic. Can you roll it back?", "cands": [{"text": "而且忘了告诉任何人。", "variants": ["a", "c", "d"]}, {"text": "还忘了告诉任何人。", "variants": ["b"]}]}, {"id": 24, "file": "dialog", "source": "Classic. Can you roll it back?", "prev": "and forgot to tell anyone.", "next": "Already on it.", "cands": [{"text": "经典。你能把它回退吗？", "variants": ["a"]}, {"text": "经典。你能把它卷回去吗？", "variants": ["b", "c", "d"]}]}, {"id": 25, "file": "dialog", "source": "Already on it.", "prev": "Classic. Can you roll it back?", "next": "Give me five minutes.", "cands": [{"text": "已经在做了。", "variants": ["a", "b", "c", "d"]}]}, {"id": 26, "file": "dialog", "source": "Give me five minutes.", "prev": "Already on it.", "next": "Take your time.", "cands": [{"text": "给我五分钟。", "variants": ["a", "b", "c", "d"]}]}, {"id": 27, "file": "dialog", "source": "Take your time.", "prev": "Give me five minutes.", "next": "The demo isn't until Friday.", "cands": [{"text": "慢慢来。", "variants": ["a", "b", "c", "d"]}]}, {"id": 28, "file": "dialog", "source": "The demo isn't until Friday.", "prev": "Take your time.", "next": "Wait, I thought it was tomorrow!", "cands": [{"text": "演示要到周五才进行。", "variants": ["a", "d"]}, {"text": "演示要到周五才开。", "variants": ["b", "c"]}]}, {"id": 29, "file": "dialog", "source": "Wait, I thought it was tomorrow!", "prev": "The demo isn't until Friday.", "next": "Nope. You're off the hook.", "cands": [{"text": "等等，我还以为是明天呢！", "variants": ["a"]}, {"text": "等等，我以为明天呢！", "variants": ["b", "c", "d"]}]}, {"id": 30, "file": "dialog", "source": "Nope. You're off the hook.", "prev": "Wait, I thought it was tomorrow!", "next": "", "cands": [{"text": "不。你不用负责了。", "variants": ["a", "b", "c", "d"]}]}], "names": {"a": "纯文本 prompt（和插件相同）", "b": "文体「字幕」+ 口语简短要求", "c": "b + 上一句做参考", "d": "上一句和下一句做参考"}};
const KEY = "ait-srt-compare";
const load = () => { try { return JSON.parse(localStorage.getItem(KEY) || "{}"); } catch { return {}; } };
const state = load(); state.picks ??= {};
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch {} };
const esc = (s) => s.replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const el = document.getElementById("items");
el.innerHTML = DATA.items.map((it) => `<article class="item" data-id="${it.id}">
  <div class="ctx">#${it.id}（${it.file === "talk" ? "演讲" : "对话"}）${it.prev ? `上一句：${esc(it.prev)}` : "（第一句）"}${it.next ? `　下一句：${esc(it.next)}` : ""}</div>
  <p class="source" lang="en">${esc(it.source)}</p>
  ${it.cands.map((c, i) => `<label class="cand"><input type="radio" name="p${it.id}" value="${i}"><span>${esc(c.text)}<span class="who" hidden>${c.variants.map((v) => v.toUpperCase()).join(" / ")}</span></span></label>`).join("")}
  <label class="same"><input type="radio" name="p${it.id}" value="same"> 都差不多</label>
</article>`).join("");
function refresh() {
  let done = 0;
  for (const it of DATA.items) {
    const v = state.picks[it.id]; const card = el.querySelector(`[data-id="${it.id}"]`);
    card.querySelectorAll("label.cand").forEach((l, i) => l.classList.toggle("chosen", String(i) === v));
    if (v !== undefined) { done++; card.querySelector(`input[value="${v}"]`).checked = true; }
    if (state.revealed) card.querySelectorAll(".who").forEach((w) => (w.hidden = false));
  }
  document.getElementById("done").textContent = done; document.getElementById("total").textContent = DATA.items.length;
  document.getElementById("reveal").disabled = done < DATA.items.length;
  if (!state.revealed) return;
  const n = { a: 0, b: 0, c: 0, d: 0 }; let same = 0;
  for (const it of DATA.items) { const v = state.picks[it.id]; if (v === "same") { same++; continue; } for (const k of it.cands[Number(v)].variants) n[k]++; }
  document.getElementById("tally").innerHTML = `<tr><th>写法</th><th>被选为最好（含并列）</th></tr>` + Object.entries(DATA.names).map(([k, name]) => `<tr><td>${k.toUpperCase()}：${name}</td><td>${n[k]}</td></tr>`).join("") + `<tr><td>都差不多</td><td>${same}</td></tr>`;
  document.getElementById("result").hidden = false;
}
el.addEventListener("change", (e) => { state.picks[e.target.name.slice(1)] = e.target.value; save(); refresh(); });
document.getElementById("reveal").addEventListener("click", () => { state.revealed = true; save(); refresh(); document.getElementById("result").scrollIntoView({ behavior: "smooth" }); });
refresh();
</script></body></html>
