<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Selection</title>
<style>
  body { font: 18px/1.6 Georgia, serif; margin: 0 auto; max-width: 720px; padding: 24px; }
  /* 故意写得很凶：插件的图标和气泡不应受影响 */
  * { color: red !important; font-family: serif !important; font-size: 22px !important; }
</style>
</head>
<body>
<p id="p1">Local models can translate a selected sentence in place.</p>
<p id="p2">A second paragraph that is only here to be selected.</p>
<input id="input" value="Text typed inside an input box" style="width: 600px">
<textarea id="textarea" style="width: 600px">Text typed inside a textarea</textarea>
<div id="editable" contenteditable="true">Editable text inside a rich editor</div>
<p id="zh">这是一段中文，不需要划词翻译。</p>
<p id="long"></p>
<div style="height: 3000px"></div>
<script>
  document.getElementById("long").textContent = "Very long selection text. ".repeat(90);
</script>
</body>
</html>
